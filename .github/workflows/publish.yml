name: publish

# 打 tag 即发布：git tag v1.0.1 && git push origin v1.0.1
#
# 认证走 npm Trusted Publishing（OIDC），仓库里不存任何 token。
# 前提：先在 npmjs.com 的包设置页配好 Trusted Publisher（见 RELEASING.md）。
# 注意 OIDC 无法做「首次发布」（包必须先存在），首次发布流程见 RELEASING.md。
#
# 手动补发：Actions 页面 Run workflow，ref 必须选已存在的 tag；默认只 dry-run。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打包校验，不真正发布"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing 不支持 self-hosted runner
    permissions:
      contents: read
      id-token: write # OIDC：换短期发布凭据，必需
    steps:
      # action 固定到 commit SHA（由 Dependabot 升级），本 job 持有 id-token
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # OIDC 要求 Node >= 22.14.0 且 npm CLI >= 11.5.1；
          # Node 22 自带 npm 10.x，所以这里用 24（自带 npm 11.x）
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 校验 npm CLI 支持 OIDC
        run: |
          CUR="$(npm --version)"
          echo "npm $CUR / node $(node --version)"
          LOW="$(printf '%s\n%s\n' 11.5.1 "$CUR" | sort -V | head -1)"
          if [ "$LOW" != "11.5.1" ]; then
            echo "::error::npm $CUR 过旧，OIDC 需 >= 11.5.1"
            exit 1
          fi

      - name: 校验 ref 是 tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag: $GITHUB_REF_NAME" ;;
            *) echo "::error::必须在 tag 上运行：$GITHUB_REF"; exit 1 ;;
          esac

      - name: 校验 tag 与 package.json version 一致
        # npm 不允许重复发布同一版本，tag 与 version 必须对齐
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != version $PKG"
            exit 1
          fi
          echo "版本一致：$PKG"

      - name: 扩展语法自检
        run: node --experimental-strip-types --check extensions/statusbar.ts

      - name: 校验发布产物只含预期文件
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
          const fs = require("fs");
          const [p] = JSON.parse(
            fs.readFileSync("/tmp/pack.json", "utf8"));
          const allow = [/^extensions\//, /^README\.md$/,
                         /^LICENSE$/, /^package\.json$/];
          const bad = p.files
            .map((f) => f.path)
            .filter((x) => !allow.some((r) => r.test(x)));
          if (bad.length) {
            console.error("产物含意外文件：", bad.join(", "));
            process.exit(1);
          }
          const list = p.files.map((f) => f.path).join(", ");
          const kb = (n) => (n / 1024).toFixed(1);
          console.log("产物文件：", list);
          console.log(`tarball ${kb(p.size)} kB,`,
                      `unpacked ${kb(p.unpackedSize)} kB`);
          '

      - name: 发布到 npm
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run：只校验，不发布"
            npm publish --dry-run
          else
            # Trusted Publishing 下 provenance 自动生成，无需 --provenance
            npm publish
          fi
